# NoobzVpn-Server Configuration (EJAYWATT - port 2086/2087)
# Port diubah dari 80/443 (konflik dengan xray) ke 2086/2087.

[tcp_plain]
local_host = ["2086"]

[tcp_ssl]
local_host = ["2087"]
tls_version = "AUTO"
key_pem = "/etc/noobzvpns/key.pem"
cert_pem = "/etc/noobzvpns/cert.pem"

[client]
ip_version = "AUTO"
tcp_initial_timeout = 30
resolv_conf = "/etc/resolv.conf"
identifier = "ejaywattapak.github.io"
banner = "You are connected to EJAYWATT server"
tcp_http_response = "HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n\r\n"

[remote]
tcp_connect_timeout = 30
tcp_idle_timeout = 900
udp_connect_timeout = 30
udp_idle_timeout = 60
udp_dns_timeout = 10

[database]
database_monitor_timer = 30
device_timeout = 5

[runtime]
worker_threads = 0
